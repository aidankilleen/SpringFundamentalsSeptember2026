<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:replace="~{fragments/bootstrap :: css}"/>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('User Manager', 'users')}"/>

    <h1 th:text="${title}">User Form</h1>

    <form
            th:object="${user}"
            th:action="${action}"
            method="POST" novalidate>
        <input id="id" th:field="*{id}" type="hidden">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}">

            <div style="color:red" th:if="${#fields.hasErrors('name')}"
            >Name can't be blank</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
            <div style="color:red" th:if="${#fields.hasErrors('email')}"
            >Enter valid email</div>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
            <label class="form-check-label" for="active">
                Active
            </label>
        </div>
        <input class="btn btn-primary" type="submit" value="ok"/>
    </form>

    <th:block th:replace="~{fragments/bootstrap :: js}"/>
</body>
</html>
