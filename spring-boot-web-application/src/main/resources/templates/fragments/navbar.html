<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<nav th:fragment="navbar-original">
    <a href="/">Home</a> |
    <a href="/about">About</a> |
    <a href="/contact">Contact Us</a> |
    <a href="/users">Users</a> |
    <a href="/help">Help</a> |
</nav>

<nav th:fragment="navbar(title, menuitem)" class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/" th:text="${title}">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a
                        class="nav-link active"
                        aria-current="page"
                        href="/"
                        th:classappend="${menuitem=='home'} ? 'active'"
                    >Home</a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link"
                        th:classappend="${menuitem=='about'} ? 'active'"
                        href="/about">About
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/contact"
                        th:classappend="${menuitem=='contact'} ? 'active'">
                        Contact Us
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/users"
                        th:classappend="${menuitem=='users'} ? 'active'"
                    >
                        Users
                    </a>
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link"
                            href="/clientsideusers"
                            th:classappend="${menuitem=='clientsideusers'} ? 'active'"
                    >
                        Client Side Users
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/help"
                        th:classappend="${menuitem=='help'} ? 'active'"
                    >Help</a>
                </li>
            </ul>
        </div>
    </div>
</nav>




</body>
</html>
